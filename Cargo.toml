[package]
name = "github-finds"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Links to GitHub projects, served as one page from a Home Assistant add-on"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
