name: GitHub Finds
version: "0.3.1"
slug: github_finds
description: New GitHub projects for your Home Assistant setup, found daily and shown on one page
url: https://github.com/heidrickla/ha-github-finds
arch:
  - amd64
  - aarch64
init: false
ports:
  8091/tcp: 8091
ingress: true
ingress_port: 8091
panel_icon: mdi:github
panel_title: Finds
map:
  - type: app_config
    read_only: false
options:
  discover: true
  per_day: 3
  topics:
    - home-assistant
    - hacs
    - esphome
    - zigbee
    - matter
    - home-automation
schema:
  discover: bool
  per_day: int(1,10)
  topics:
    - match(^[a-z0-9][a-z0-9-]{0,49}$)
  router: url?
  model: match(^[A-Za-z0-9._:/-]{1,64}$)?
  interests: str?
