[package]
name = "github-finds"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "New GitHub projects found daily, judged by stars or by a model, served as one page from a Home Assistant add-on"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
