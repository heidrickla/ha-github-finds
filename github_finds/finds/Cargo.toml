[package]
name = "github-finds"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "New GitHub projects found daily, judged by stars or by a model, served as one page from a Home Assistant add-on"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
